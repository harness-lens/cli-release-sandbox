name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.25.x" }
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node-version: [20, 22, 24] }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node-version }}" }
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm pack --dry-run
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy,rustfmt" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked -- --version
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned scanner image
        run: docker build --file Containerfile --tag harness-lens-cli:test .
      - name: Verify non-root runtime and CLI version
        run: |
          test "$(docker run --rm --entrypoint id harness-lens-cli:test -u)" = "65532"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' rust/Cargo.toml | head -n 1)"
          test "$(docker run --rm harness-lens-cli:test --version)" = "harness-lens ${version}"
  language-placeholders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.22.x" }
      - name: Test Go placeholder
        working-directory: placeholders/go
        run: go test ./...
      - name: Configure C and C++ placeholder
        run: cmake -S placeholders/cpp -B build/placeholders/cpp -DBUILD_TESTING=ON
      - name: Build C and C++ placeholder
        run: cmake --build build/placeholders/cpp
      - name: Test C and C++ placeholder
        run: ctest --test-dir build/placeholders/cpp --output-on-failure

  homebrew-formula:
    name: Homebrew formula (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - name: Check out the PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up stable Homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1
        with:
          core: true
          cask: false
          stable: true
      - name: Generate formula regression fixture
        run: |
          node --input-type=module <<'JS'
          import { mkdir, writeFile } from 'node:fs/promises';
          import { renderPackages } from './scripts/generate-distribution-packages.mjs';
          const version = '0.0.5';
          const sums = [
            'a'.repeat(64) + `  harness-lens-v${version}-aarch64-apple-darwin.tar.gz`,
            'b'.repeat(64) + `  harness-lens-v${version}-x86_64-apple-darwin.tar.gz`,
            'c'.repeat(64) + `  harness-lens-v${version}-x86_64-pc-windows-msvc.zip`,
          ].join('\n');
          await mkdir('Formula');
          await writeFile('Formula/harness-lens.rb', renderPackages(version, sums)['homebrew/Formula/harness-lens.rb']);
          JS
      - name: Parse, style, and strictly audit the generated formula
        env:
          TAP: harness-lens/validation
        run: |
          brew tap-new --no-git "$TAP"
          cp Formula/harness-lens.rb "$(brew --repository "$TAP")/Formula/harness-lens.rb"
          brew trust --formula "$TAP/harness-lens"
          brew readall --os=all --arch=all "$TAP"
          brew style "$TAP/harness-lens"
          brew audit --strict "$TAP/harness-lens"
      - name: Verify native architecture URL and checksum selection
        env:
          TAP: harness-lens/validation
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          brew info --json=v2 "$TAP/harness-lens" > "$RUNNER_TEMP/formula.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const { formulae: [formula] } = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/formula.json`, 'utf8'));
          const arm = process.env.EXPECTED_ARCH === 'arm64';
          assert.equal(formula.versions.stable, '0.0.5');
          assert.equal(formula.urls.stable.url, `https://github.com/harness-lens/cli/releases/download/v0.0.5/harness-lens-v0.0.5-${arm ? 'aarch64' : 'x86_64'}-apple-darwin.tar.gz`);
          assert.equal(formula.urls.stable.checksum, (arm ? 'a' : 'b').repeat(64));
          JS

name: Native release and distribution

on:
  workflow_dispatch:
    inputs:
      version:
        description: Unused SemVer version already declared by the source on main
        required: true
        type: string

concurrency:
  group: native-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the dispatched main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate source and all package versions
        id: release
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! [[ "$RELEASE_VERSION" =~ $semver_pattern ]]; then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 1
          fi
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "Production releases must be dispatched from main." >&2
            exit 1
          fi
          version="$RELEASE_VERSION"
          tag="v${version}"
          crate_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' rust/Cargo.toml | head -n 1)"
          npm_version="$(node --input-type=module -e 'import packageJson from "./package.json" with { type: "json" }; process.stdout.write(packageJson.version)')"
          lock_version="$(node --input-type=module -e 'import lock from "./package-lock.json" with { type: "json" }; process.stdout.write(lock.version)')"
          lock_root_version="$(node --input-type=module -e 'import lock from "./package-lock.json" with { type: "json" }; process.stdout.write(lock.packages[""].version)')"
          cargo_lock_version="$(awk '$0 == "name = \"harness-lens-cli\"" { found=1; next } found && /^version = / { sub(/^version = "/, ""); sub(/"$/, ""); print; exit }' rust/Cargo.lock)"
          if [[ "$version" == "$crate_version" && "$version" == "$npm_version" && "$version" == "$lock_version" && "$version" == "$lock_root_version" && "$version" == "$cargo_lock_version" ]]; then
            :
          else
            echo "Requested version $version differs from crate=$crate_version cargo-lock=$cargo_lock_version npm=$npm_version lock=$lock_version lock-root=$lock_root_version" >&2
            exit 1
          fi
          source_sha="$(git rev-parse HEAD)"
          event_sha="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if [[ "$source_sha" != "$event_sha" ]]; then
            echo "Checked-out source SHA does not match the workflow event SHA." >&2
            exit 1
          fi
          {
            echo "sha=$source_sha"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Fail before building if the version, tag, or release is already consumed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: node scripts/release-transaction.mjs preflight

  build-native:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            executable: harness-lens
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: harness-lens
            archive: tar.gz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            executable: harness-lens.exe
            archive: zip
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable: harness-lens
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - name: Select Rust 1.85 toolchain
        shell: bash
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
          rustup target add "${{ matrix.target }}"
      - name: Build and smoke-test native CLI
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          cargo build --locked --release --manifest-path rust/Cargo.toml --target "${{ matrix.target }}"
          actual_version="$("rust/target/${{ matrix.target }}/release/${{ matrix.executable }}" --version)"
          if [[ "$actual_version" != "harness-lens ${VERSION}" ]]; then
            echo "Binary reported unexpected version: $actual_version" >&2
            exit 1
          fi
      - name: Package native CLI
        shell: bash
        env:
          ARCHIVE_FORMAT: ${{ matrix.archive }}
          EXECUTABLE: ${{ matrix.executable }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          archive="harness-lens-v${VERSION}-${TARGET}.${ARCHIVE_FORMAT}"
          mkdir -p dist/stage
          cp "rust/target/${TARGET}/release/${EXECUTABLE}" dist/stage/
          cp README.md LICENSE COPYRIGHT dist/stage/
          node --input-type=module -e '
            import { readdir } from "node:fs/promises";
            const expected = ["COPYRIGHT", "LICENSE", "README.md", process.env.EXECUTABLE].sort();
            const entries = await readdir("dist/stage", { withFileTypes: true });
            const actual = entries.map((entry) => entry.name).sort();
            if (entries.some((entry) => !entry.isFile()) || JSON.stringify(actual) !== JSON.stringify(expected)) {
              throw new Error("unsafe or unexpected archive content: " + actual.join(", "));
            }
          '
          if [[ "$ARCHIVE_FORMAT" == "zip" ]]; then
            (cd dist/stage && 7z a -tzip "../${archive}" ./*)
          else
            tar -C dist/stage -czf "dist/${archive}" .
          fi
          node scripts/generate-cyclonedx.mjs "$TARGET" "dist/${archive}.cdx.json"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/harness-lens-v${{ needs.metadata.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/harness-lens-v${{ needs.metadata.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
          sbom-path: dist/harness-lens-v${{ needs.metadata.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}.cdx.json
      - name: Preserve native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: dist/harness-lens-v${{ needs.metadata.outputs.version }}-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 30

  build-npm:
    name: Build and test reviewed npm tarball
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - name: Pack exact npm tarball
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          mkdir npm-package
          npm pack --pack-destination npm-package
          test -f "npm-package/harness-lens-cli-${VERSION}.tgz"
          test "$(find npm-package -maxdepth 1 -type f | wc -l)" = "1"
      - name: Preserve reviewed npm tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: npm-package/*.tgz
          if-no-files-found: error
          retention-days: 30

  homebrew:
    name: Build Homebrew tap package
    needs: [metadata, build-native]
    runs-on: macos-15
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - name: Download native artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: dist/native
          merge-multiple: true
      - name: Generate and validate formula
        run: |
          node scripts/generate-checksums.mjs dist/native dist/SHA256SUMS
          node scripts/generate-distribution-packages.mjs "${{ needs.metadata.outputs.version }}" dist/SHA256SUMS dist/generated
          ruby -c dist/generated/homebrew/Formula/harness-lens.rb
      - name: Preserve checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Preserve Homebrew formula
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-tap
          path: dist/generated/homebrew
          if-no-files-found: error
          retention-days: 30

  homebrew-audit:
    name: Audit candidate Homebrew formula (${{ matrix.arch }})
    needs: homebrew
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - name: Set up stable Homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1
        with:
          core: true
          cask: false
          stable: true
      - name: Download the exact candidate formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-tap
          path: candidate-homebrew
      - name: Parse, style, and strictly audit before publication
        env:
          TAP: harness-lens/validation
        run: |
          brew tap-new --no-git "$TAP"
          cp candidate-homebrew/Formula/harness-lens.rb "$(brew --repository "$TAP")/Formula/harness-lens.rb"
          brew trust --formula "$TAP/harness-lens"
          brew readall --os=all --arch=all "$TAP"
          brew style "$TAP/harness-lens"
          brew audit --strict "$TAP/harness-lens"

  windows-packages:
    name: Build WinGet, Scoop, and Chocolatey packages
    needs: [metadata, build-native, homebrew]
    runs-on: windows-2025
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - name: Download release checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-checksums
          path: dist
      - name: Generate Windows packages
        shell: pwsh
        run: |
          node scripts/generate-distribution-packages.mjs '${{ needs.metadata.outputs.version }}' dist/SHA256SUMS dist/generated
          Get-Content dist/generated/scoop/harness-lens.json -Raw | ConvertFrom-Json | Out-Null
          Push-Location dist/generated/chocolatey
          choco pack harness-lens.nuspec --output-directory .
          Pop-Location
      - name: Preserve Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-packages
          path: |
            dist/generated/winget
            dist/generated/scoop
            dist/generated/chocolatey
          if-no-files-found: error
          retention-days: 30

  assemble-release:
    name: Assemble signed release
    needs: [metadata, build-native, build-npm, homebrew, homebrew-audit, windows-packages]
    runs-on: ubuntu-24.04
    outputs:
      candidate_attempt: ${{ steps.candidate.outputs.attempt }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - name: Download native artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: release
          merge-multiple: true
      - name: Download reviewed npm tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release
      - name: Download Homebrew tap package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-tap
          path: staging/homebrew
      - name: Download Windows packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-packages
          path: staging/windows
      - name: Assemble distribution assets
        id: candidate
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          tar -C staging/homebrew -czf "release/harness-lens-homebrew-tap-v${VERSION}.tar.gz" .
          (cd staging/windows/winget && zip -qr "../../../release/harness-lens-winget-v${VERSION}.zip" .)
          cp staging/windows/scoop/harness-lens.json "release/harness-lens-scoop-v${VERSION}.json"
          cp staging/windows/chocolatey/*.nupkg release/
          node scripts/generate-checksums.mjs release release/SHA256SUMS
          node scripts/release-transaction.mjs manifest release
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Attest assembled assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: release/SHA256SUMS
      - name: Attest the release manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/RELEASE-MANIFEST.json
      - name: Preserve complete reviewed candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-lens-${{ needs.metadata.outputs.tag }}-release
          path: release
          if-no-files-found: error
          retention-days: 30
  publish-release:
    name: Publish protected GitHub release
    needs: [metadata, assemble-release]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - name: Mint repository-scoped release token
        id: release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.HARNESS_LENS_APP_ID }}
          private-key: ${{ secrets.HARNESS_LENS_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Download assembled release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: harness-lens-${{ needs.metadata.outputs.tag }}-release
          path: release
      - name: Verify the retained candidate belongs to this run
        env:
          RELEASE_RUN_ATTEMPT: ${{ needs.assemble-release.outputs.candidate_attempt }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
        run: node scripts/release-transaction.mjs verify release
      - name: Create or reconcile the bound draft and exact assets
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          RELEASE_RUN_ATTEMPT: ${{ needs.assemble-release.outputs.candidate_attempt }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
        run: node scripts/release-transaction.mjs prepare release
      - name: Publish and verify the immutable release
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          RELEASE_RUN_ATTEMPT: ${{ needs.assemble-release.outputs.candidate_attempt }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
        run: node scripts/release-transaction.mjs publish release

  publish-npm:
    name: Publish npm from the same reviewed source
    needs: [metadata, assemble-release, publish-release]
    if: github.repository == 'harness-lens/cli'
    uses: ./.github/workflows/publish.yml
    with:
      candidate_attempt: ${{ needs.assemble-release.outputs.candidate_attempt }}
      source_sha: ${{ needs.metadata.outputs.sha }}
      tag: ${{ needs.metadata.outputs.tag }}
    permissions:
      contents: read
      id-token: write

  publish-homebrew-tap:
    name: Propose harness-lens/homebrew-tap update
    needs: [metadata, publish-release, publish-npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - name: Report disabled tap publishing
        if: vars.HOMEBREW_TAP_PUBLISH_ENABLED != 'true'
        run: echo "Homebrew tap publishing is disabled; GHCR remains blocked."
      - name: Check out release source
        if: vars.HOMEBREW_TAP_PUBLISH_ENABLED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - name: Download original reviewed release
        if: vars.HOMEBREW_TAP_PUBLISH_ENABLED == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: harness-lens-${{ needs.metadata.outputs.tag }}-release
          path: release
      - name: Mint scoped tap installation token
        if: vars.HOMEBREW_TAP_PUBLISH_ENABLED == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.HARNESS_LENS_APP_ID }}
          private-key: ${{ secrets.HARNESS_LENS_APP_PRIVATE_KEY }}
          owner: harness-lens
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write
      - name: Create or reuse reviewed formula PR
        if: vars.HOMEBREW_TAP_PUBLISH_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ steps.app-token.outputs.token }}
          HOMEBREW_TAP_PUBLISH_ENABLED: ${{ vars.HOMEBREW_TAP_PUBLISH_ENABLED }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
        run: node scripts/homebrew-pr.mjs open

  homebrew-merge-gate:
    name: Require merged Homebrew formula and macOS CI
    needs: [metadata, publish-release, publish-homebrew-tap]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    outputs:
      merged: ${{ steps.gate.outputs.merged }}
    steps:
      - name: Require enabled Homebrew publication
        env:
          ENABLED: ${{ vars.HOMEBREW_TAP_PUBLISH_ENABLED }}
        run: |
          if [[ "$ENABLED" != "true" ]]; then
            echo "Homebrew publishing is disabled; GHCR must remain blocked." >&2
            exit 1
          fi
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - name: Download original reviewed release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: harness-lens-${{ needs.metadata.outputs.tag }}-release
          path: release
      - name: Mint fresh read-only tap token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.HARNESS_LENS_APP_ID }}
          private-key: ${{ secrets.HARNESS_LENS_APP_PRIVATE_KEY }}
          owner: harness-lens
          repositories: homebrew-tap
          permission-contents: read
          permission-pull-requests: read
      - name: Verify exact merged formula and both macOS checks
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ steps.app-token.outputs.token }}
          HOMEBREW_TAP_PUBLISH_ENABLED: ${{ vars.HOMEBREW_TAP_PUBLISH_ENABLED }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
        run: node scripts/homebrew-pr.mjs gate

  publish-ghcr:
    name: Publish GHCR scanner image
    needs: [metadata, publish-release, homebrew-merge-gate]
    if: needs.homebrew-merge-gate.outputs.merged == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE: ghcr.io/harness-lens/cli
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - name: Download original reviewed release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: harness-lens-${{ needs.metadata.outputs.tag }}-release
          path: release
      - name: Mint fresh read-only tap token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.HARNESS_LENS_APP_ID }}
          private-key: ${{ secrets.HARNESS_LENS_APP_PRIVATE_KEY }}
          owner: harness-lens
          repositories: homebrew-tap
          permission-contents: read
          permission-pull-requests: read
      - name: Recheck merge gate after environment approval
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ steps.app-token.outputs.token }}
          HOMEBREW_TAP_PUBLISH_ENABLED: ${{ vars.HOMEBREW_TAP_PUBLISH_ENABLED }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
        run: node scripts/homebrew-pr.mjs gate
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Configure Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Define immutable image tags
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.metadata.outputs.version }}
            type=raw,value=sha-${{ needs.metadata.outputs.sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ needs.metadata.outputs.sha }}
      - name: Build and publish scanner image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Attest GHCR image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
